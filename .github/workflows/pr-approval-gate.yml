name: PR Approval Gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

env:
  # คั่นด้วย comma ถ้ามี Senior หลายคน
  SENIOR_REVIEWER: "Pantira111"

jobs:
  check-approval:
    name: Check Senior Approval
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Evaluate Senior Approval
        uses: actions/github-script@v7
        with:
          script: |
            const seniors = process.env.SENIOR_REVIEWER.split(',').map(s => s.trim().toLowerCase());
            const pr = context.payload.pull_request;
            const author = pr.user.login.toLowerCase();

            // (a) ผู้เปิด PR เป็น Senior -> Senior self-merge
            let ok = seniors.includes(author);
            let desc = ok ? `Senior self-merge (@${pr.user.login})` : '';

            // (b) มี Approved review จาก Senior ที่ไม่ใช่ผู้เปิด PR (นับ review ล่าสุดของแต่ละคน)
            if (!ok) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              const latest = {};
              for (const r of reviews) {
                if (r.state === 'COMMENTED') continue;
                latest[r.user.login.toLowerCase()] = r.state;
              }
              const approver = Object.keys(latest).find(
                u => latest[u] === 'APPROVED' && seniors.includes(u) && u !== author
              );
              ok = !!approver;
              desc = ok ? `Approved by @${approver}` : 'Waiting for Senior approval';
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: ok ? 'success' : 'pending',
              context: 'Senior Approval',
              description: desc
            });
