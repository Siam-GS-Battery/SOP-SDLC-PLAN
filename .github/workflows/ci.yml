name: CI

on:
  pull_request:
    branches: [main, develop, staging]

env:
  SENIOR_REVIEWER: "Pantira111"

jobs:
  # -----------------------------------------------------------
  # Lint & Test — รันเฉพาะเมื่อมี package.json (โปรเจกต์ Node.js)
  # ถ้าเป็น docs-only repo จะ skip อัตโนมัติ
  # -----------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if package.json exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
            echo "No package.json found — skipping lint (docs-only repo)"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_package == 'true'
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        if: steps.check.outputs.has_package == 'true'
        run: npm ci

      - name: Run Lint
        if: steps.check.outputs.has_package == 'true'
        run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Check if package.json exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
            echo "No package.json found — skipping tests (docs-only repo)"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_package == 'true'
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        if: steps.check.outputs.has_package == 'true'
        run: npm ci

      - name: Run Tests
        if: steps.check.outputs.has_package == 'true'
        run: npm test

  # -----------------------------------------------------------
  # Auto-assign Senior เป็น Reviewer
  # -----------------------------------------------------------
  assign-reviewer:
    name: Assign Senior Reviewer
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    permissions:
      pull-requests: write
    steps:
      - name: Request review from Senior
        uses: actions/github-script@v7
        with:
          script: |
            const reviewer = process.env.SENIOR_REVIEWER;
            const prAuthor = context.payload.pull_request.user.login;

            if (prAuthor === reviewer) {
              console.log('PR author is the reviewer, skipping auto-assign');
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: [reviewer]
            });

            console.log(`Assigned ${reviewer} as reviewer`);
