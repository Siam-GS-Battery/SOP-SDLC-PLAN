name: CI

on:
  pull_request:
    branches: [main, develop, staging]

env:
  SENIOR_REVIEWER: "Pantira111"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  assign-reviewer:
    name: Assign Senior Reviewer
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    permissions:
      pull-requests: write
    steps:
      - name: Request review from Senior
        uses: actions/github-script@v7
        with:
          script: |
            const reviewer = process.env.SENIOR_REVIEWER;
            const prAuthor = context.payload.pull_request.user.login;

            if (prAuthor === reviewer) {
              console.log('PR author is the reviewer, skipping auto-assign');
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: [reviewer]
            });

            console.log(`Assigned ${reviewer} as reviewer`);
