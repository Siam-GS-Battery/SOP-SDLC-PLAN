name: Publish Packages to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (publish with --dry-run)'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish workspaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js + GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@siam-gs-battery'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🧪 Dry run — packages will NOT be published"
            npm publish --workspaces --access restricted --dry-run
          else
            npm publish --workspaces --access restricted
          fi
